<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETINVICTUS | Gestión de Usuarios</title>
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<!-- Se agregan las clases de flexbox nativas de Bootstrap para el sticky footer -->
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- MENÚ SUPERIOR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">
                <img src="img/logo.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded me-2">
                CETINVICTUS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Métricas (En vivo)</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="usuarios.html">Gestión de Usuarios</a></li>
                </ul>
                <div class="d-flex text-white align-items-center mt-2 mt-lg-0">
                    <!-- Contenedor del Badge -->
                    <span class="me-3 fw-bold small" id="user-info-badge"></span>
                    <button id="btn-salir" class="btn btn-sm btn-outline-light">Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL (flex-grow-1 empuja el footer hacia abajo) -->
    <div class="container mt-4 mb-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios y Clientes</h2>
            <button class="btn btn-success fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoUsuario">
                + Crear Nuevo Usuario
            </button>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" id="inputBuscador" placeholder="Buscar por correo electrónico...">
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Correo Electrónico</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <!-- Contenido dinámico -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-success text-white">
            <h5 class="modal-title fw-bold" id="modalTitulo">Crear Nuevo Usuario</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
            <div id="nuevo-error" class="alert alert-danger d-none py-2 small"></div>
            <form id="formNuevoUsuario">
                <div class="row g-3">
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Nombre</label>
                    <input class="form-control" id="nuevoNombre" required></div>
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Apellido</label>
                    <input class="form-control" id="nuevoApellido" required></div>
                <div class="col-md-8"><label class="form-label small text-muted fw-bold">Correo</label>
                    <input type="email" class="form-control" id="nuevoCorreo" required></div>
                <div class="col-md-4"><label class="form-label small text-muted fw-bold">Edad</label>
                    <input type="number" min="0" class="form-control" id="nuevoEdad"></div>
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Teléfono</label>
                    <input class="form-control" id="nuevoTelefono"></div>
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Compañía</label>
                    <input class="form-control" id="nuevoCompania"></div>
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Estado</label>
                    <input class="form-control" id="nuevoEstado"></div>
                <div class="col-md-6"><label class="form-label small text-muted fw-bold">Colonia</label>
                    <input class="form-control" id="nuevoColonia"></div>
                <div class="col-md-8"><label class="form-label small text-muted fw-bold">Contraseña <span class="fw-normal">(al editar, vacía = no cambiar)</span></label>
                    <input type="password" class="form-control" id="nuevoPassword" minlength="8"></div>
                <div class="col-md-4"><label class="form-label small text-muted fw-bold">Rol</label>
                    <select class="form-select" id="nuevoRol">
                    <option value="cliente" selected>Cliente</option><option value="admin">Administrador</option>
                    </select></div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mt-4" id="btnGuardarUsuario">Crear usuario</button>
            </form>
            </div>
        </div></div>
    </div>

    <!-- FOOTER (mt-auto es la clave de Bootstrap para mandarlo al fondo) -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>Proyecto Hackathon 2026</strong> | CETINVICTUS - Clean Water For All</p>
            <small class="text-muted">Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/users.js"></script>
    
    <!-- SCRIPT INFALIBLE PARA RENDERIZAR EL USUARIO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const badge = document.getElementById('user-info-badge');
            if (badge) {
                let nombre = sessionStorage.getItem('userName');
                const correo = sessionStorage.getItem('userEmail');
                const rol = sessionStorage.getItem('userRole');
                
                // Si el nombre no existe, toma el fragmento del correo
                if (!nombre || nombre === 'null') {
                    nombre = correo ? correo.split('@')[0] : 'Usuario';
                }
                
                const rolTexto = rol === 'admin' ? 'Administrador' : 'Cliente';
                badge.innerHTML = `👤 ${nombre} | Rol: <span class="text-warning">${rolTexto}</span>`;
            }
        });
    </script>
</body>
</html>
