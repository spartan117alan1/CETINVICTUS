<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETINVICTUS | Gestión de Usuarios</title>
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- MENÚ SUPERIOR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">
                <img src="img/logo.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded me-2">
                CETINVICTUS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Métricas (En vivo)</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="usuarios.html">Gestión de Usuarios</a></li>
                </ul>
                <div class="d-flex text-white align-items-center">
                    <span class="me-3 fw-bold">Rol: Administrador</span>
                    <button class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Usuarios y Clientes</h2>
            <button class="btn btn-success fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoUsuario">
                + Crear Nuevo Usuario
            </button>
        </div>

        <!-- BARRA DE BÚSQUEDA -->
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" id="inputBuscador" placeholder="🔍 Buscar por correo electrónico..." onkeyup="filtrarUsuarios()">
            </div>
        </div>

        <!-- TABLA DE USUARIOS -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>Correo Electrónico</th>
                                <th>Teléfono</th>
                                <th>Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <!-- Los usuarios se cargarán aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA NUEVO USUARIO -->
    <div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formUsuario">
                        <div class="row g-3">
                            <!-- Tipo de Usuario -->
                            <div class="col-12 mb-3">
                                <label class="form-label text-muted small fw-bold">Tipo de Cuenta (Rol)</label>
                                <select class="form-select border-primary" id="rolUsuario" onchange="toggleCamposCliente()" required>
                                    <option value="cliente" selected>Ciudadano / Cliente</option>
                                    <option value="admin">Administrador / Soporte Técnico</option>
                                </select>
                            </div>

                            <!-- Datos Personales -->
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Nombre(s)</label>
                                <!-- pattern evita números -->
                                <input type="text" class="form-control" id="nombreUsuario" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se permiten letras" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Apellidos</label>
                                <input type="text" class="form-control" id="apellidoUsuario" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se permiten letras" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">Edad</label>
                                <input type="number" class="form-control" id="edadUsuario" min="18" max="99" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label text-muted small fw-bold">Teléfono Móvil</label>
                                <input type="tel" class="form-control" id="telefonoUsuario" pattern="[0-9]{10}" placeholder="10 dígitos" required>
                            </div>

                            <!-- Campos Específicos para Clientes (Se ocultan si elige Admin) -->
                            <div class="col-12" id="camposCliente">
                                <div class="card bg-light border-0 p-3 mt-2">
                                    <h6 class="text-primary mb-3">Datos de Ubicación (Solo Clientes)</h6>
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label text-muted small fw-bold">Compañía Suministradora</label>
                                            <select class="form-select" id="companiaUsuario">
                                                <!-- ¡Unico valor en México para el ejemplo! -->
                                                <option value="CONAGUA">CONAGUA (Comisión Nacional del Agua)</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label text-muted small fw-bold">Estado</label>
                                            <select class="form-select" id="estadoUsuario">
                                                <option value="" disabled selected>Seleccione...</option>
                                                <option value="Aguascalientes">Aguascalientes</option>
                                                <option value="Baja California">Baja California</option>
                                                <option value="Ciudad de México">Ciudad de México</option>
                                                <option value="Jalisco">Jalisco</option>
                                                <option value="Nuevo León">Nuevo León</option>
                                                <!-- ... puedes agregar los demás después ... -->
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label text-muted small fw-bold">Colonia / Sector</label>
                                            <input type="text" class="form-control" id="coloniaUsuario">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Datos de Acceso -->
                            <div class="col-md-6 mt-4">
                                <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correoUsuario" required>
                            </div>
                            <div class="col-md-6 mt-4">
                                <label class="form-label text-muted small fw-bold">Contraseña</label>
                                <input type="password" class="form-control" id="passUsuario" oninput="evaluarPassword()" required>
                                <!-- Verificador de fortaleza -->
                                <div class="progress mt-2" style="height: 5px;">
                                    <div id="passStrengthBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%;"></div>
                                </div>
                                <small id="passStrengthText" class="text-danger mt-1 d-block">Demasiado corta</small>
                            </div>
                        </div>
                        <hr class="mt-4">
                        <button type="submit" class="btn btn-success w-100 fw-bold fs-5">Guardar Usuario en Base de Datos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/usuarios.js"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
