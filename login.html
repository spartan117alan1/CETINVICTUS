<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | CETINVICTUS</title>
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<!-- BODY con Flexbox de Bootstrap para ocupar toda la pantalla -->
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAV -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="img/logo.jpg" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded me-2">
                CETINVICTUS
            </a>
        </div>
    </nav>
        
    <!-- CONTENEDOR CENTRAL -->
    <!-- flex-grow-1 empuja el footer hacia abajo, d-flex y align-items-center centran la tarjeta -->
    <div class="container d-flex justify-content-center align-items-center flex-grow-1 my-4">
        <div class="card shadow-sm border-0 p-4" style="max-width: 400px; width: 100%;">
            <h4 class="text-center fw-bold mb-3" style="color: #005C53;">Iniciar Sesión</h4>
            
            <div id="login-error" class="alert alert-danger d-none py-2 text-center small">
                Credenciales incorrectas.
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="admin@cetinvictus.com">
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted small">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn w-100 fw-bold text-white mb-3" style="background-color: #005C53;">Ingresar al Sistema</button>
                
                <div class="text-center">
                    <a href="index.html" class="text-decoration-none small text-muted">← Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <!-- mt-auto asegura que siempre se quede pegado al final -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">© 2026 <strong>Proyecto Hackathon 2026</strong> | CETINVICTUS - Clean Water For All</p>
            <small class="text-muted">Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
