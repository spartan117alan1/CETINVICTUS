<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | CETINVICTUS</title>
    <!-- 1. AQUÍ AGREGAMOS EL FAVICON PARA LA PESTAÑA -->
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-bg">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <!-- 2. AQUÍ AGREGAMOS EL LOGO AL NAVBAR -->
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <!-- La imagen se reduce a 30x30px para que encaje perfectamente -->
                <img src="img/logo.jpg" alt="Logo CETINVICTUS" width="30" height="30" class="d-inline-block align-text-top rounded me-2">
                CETINVICTUS
                <link href="index.html" rel="stylesheet">
            </a>
            </div>
        </div>
    </nav>
        
        <div class="p-4">

            <div id="login-error" class="alert alert-danger d-none py-2 text-center small">
                Credenciales incorrectas.
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required placeholder="admin@cetinvictus.com">
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted small">Contraseña</label>
                    <input type="password" class="form-control" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn w-100 fw-bold text-white mb-3" style="background-color: #005C53;">Ingresar al Sistema</button>
                
                <div class="text-center">
                    <a href="index.html" class="text-decoration-none small text-muted">← Volver al inicio</a>
                </div>
            </form>
        </div>
    </>


    <script src="js/app.js"></script>
</body>
</html>
