<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETINVICTUS | Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        .kpi-card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bg-optimal { background-color: #d1e7dd; color: #0f5132; }
        .bg-alert { background-color: #f8d7da; color: #842029; }
    </style>
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">💧 CETINVICTUS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Métricas (En vivo)</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Reportes</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Soporte</a></li>

                    
                    <li class="nav-item admin-only"><a class="nav-link text-warning" href="#">Gestión de Usuarios</a></li>
                    <li class="nav-item admin-only"><a class="nav-link text-warning" href="#">Ajuste de Sensores</a></li>
                </ul>
                <div class="d-flex text-white align-items-center">
                    <span class="me-3" id="user-role-badge">Rol: Admin</span>
                    <button class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button>
                </div>
            </div>
        </div>
    </nav>


    <div class="container mt-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Monitoreo de Calidad de Agua</h2>
            <span class="badge bg-success fs-6" id="estado-general">Red Estable</span>
        </div>

        <div class="row g-3 mb-4">
       
            <div class="col-md-3">
                <div class="card kpi-card bg-optimal text-center p-3">
                    <h6 class="card-title text-uppercase text-muted mb-1">Nivel de pH</h6>
                    <h2 class="fw-bold mb-0" id="val-ph">7.2</h2>
                </div>
            </div>
      
            <div class="col-md-3">
                <div class="card kpi-card bg-optimal text-center p-3">
                    <h6 class="card-title text-uppercase text-muted mb-1">Turbidez (NTU)</h6>
                    <h2 class="fw-bold mb-0" id="val-turbidez">1.5</h2>
                </div>
            </div>
         
            <div class="col-md-3">
                <div class="card kpi-card bg-alert text-center p-3">
                    <h6 class="card-title text-uppercase text-muted mb-1">Sólidos (TDS)</h6>
                    <h2 class="fw-bold mb-0" id="val-tds">450 ppm</h2>
                    <small class="text-danger">Revisión sugerida</small>
                </div>
            </div>
         
            <div class="col-md-3">
                <div class="card kpi-card bg-optimal text-center p-3">
                    <h6 class="card-title text-uppercase text-muted mb-1">Temperatura</h6>
                    <h2 class="fw-bold mb-0" id="val-temp">24°C</h2>
                </div>
            </div>
        </div>

       
        <div class="row">
            <div class="col-12">
                <div class="card kpi-card p-3">
                    <h5>Tendencia de Pureza en Tiempo Real</h5>
                  
                    <canvas id="graficaSensores" height="80"></canvas>
                </div>
            </div>
            
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script src="js/app.js"></script>
</body>
</html>
